<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WMK Calc Studio — Calculadora</title>
  <link rel="stylesheet" href="/exemplo/calculadora/style.css">
  <script src="/exemplo/calculadora/app.js" defer></script>
</head>
<body>
  <main class="calculator" aria-label="Calculadora WMK">
    <div class="heading">
      <span class="brand">WMK <span>CALC</span></span>
      <small>v1.1 · Calculadora</small>
    </div>
    <output id="display" class="display" aria-live="polite" aria-label="Resultado">0</output>
    <div class="keys" aria-label="Teclas da calculadora">
      <button data-action="clear" class="utility">AC</button>
      <button data-action="backspace" class="utility" aria-label="Apagar último caractere">⌫</button>
      <button data-action="percent" class="utility">%</button>
      <button data-op="/" class="operator">÷</button>
      <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
      <button data-op="*" class="operator">×</button>
      <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
      <button data-op="-" class="operator">−</button>
      <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
      <button data-op="+" class="operator">+</button>
      <button data-action="sign">±</button><button data-digit="0">0</button>
      <button data-action="decimal">,</button><button data-action="equals" class="equals">=</button>
    </div>
    <p class="hint">Teclado: números, + − * /, Enter, Backspace e Esc</p>
  </main>
  <footer>Walney Moreira Klein — walneyk@hotmail.com</footer>
</body>
</html>
