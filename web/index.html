<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WMK Desktop Bridge 0.2.0</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#0c111b;color:#dfedfa}
*{box-sizing:border-box}body{margin:0;overflow:hidden}header{height:64px;background:#111c2d;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #29465b}
h1{font-size:19px;margin:0;color:#4bd9ec}small{color:#95aec2}button{background:#16364e;color:#eafaff;border:1px solid #33708b;border-radius:6px;padding:8px 12px;cursor:pointer}button:hover{background:#215575}
#workspace{height:calc(100vh - 94px);position:relative;background:radial-gradient(ellipse at 50% 50%,#152438,#0b111b 70%)}
.panel{position:absolute;background:#152234;border:1px solid #2c4b61;border-radius:10px;box-shadow:0 12px 35px #0008;min-width:260px;min-height:160px;resize:both;overflow:auto}
.panel .bar{padding:9px 12px;background:#20364e;display:flex;justify-content:space-between;cursor:move;user-select:none;position:sticky;top:0;z-index:1;font-weight:600;color:#80e9f4}
.panel .content{padding:12px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
#disks{top:22px;left:22px;width:430px;height:260px}#home{top:22px;left:475px;width:420px;height:330px}#ollama{top:300px;left:22px;width:430px;height:245px}#about{top:375px;left:475px;width:420px;height:180px}
pre{font:12px Consolas,monospace;white-space:pre-wrap;margin:0} .disk{margin:12px 0}.track{height:11px;background:#314457;border-radius:6px;overflow:hidden;margin:5px 0}.fill{height:100%;background:linear-gradient(90deg,#24c5da,#f6a34c)}
footer{height:30px;background:#111c2d;color:#8daec3;padding:6px 18px;font-size:12px}
@media(max-width:850px){body{overflow:auto}#workspace{height:auto;padding:12px;display:grid;gap:12px}.panel,#disks,#home,#ollama,#about{position:relative;top:auto;left:auto;width:100%;height:250px}}
</style></head>
<body>
<header><div><h1>WMK Desktop Bridge <small>v0.2.0</small></h1><small>Diagnóstico local • somente leitura • painéis móveis</small></div><div><button id="refresh">Atualizar</button> <button id="reset">Restaurar layout</button></div></header>
<main id="workspace">
<section class="panel" id="disks"><div class="bar">💽 Discos <span>☰</span></div><div class="content">Carregando...</div></section>
<section class="panel" id="home"><div class="bar">📁 Pasta do usuário <span>☰</span></div><div class="content">Carregando...</div></section>
<section class="panel" id="ollama"><div class="bar">🤖 Ollama <span>☰</span></div><div class="content">Carregando...</div></section>
<section class="panel" id="about"><div class="bar">🛡️ Segurança e estado <span>☰</span></div><div class="content">Carregando...</div></section>
</main><footer>Walney Moreira Klein — walneyk@hotmail.com · WMK Desktop Bridge</footer>
<script>
const ids=['disks','home','ollama','about'];const key='wmk-desktop-layout-v1';
function put(id,text){document.querySelector('#'+id+' .content').replaceChildren(document.createTextNode(text));}
async function fetchJSON(url){const r=await fetch(url,{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.erro||r.status);return j}
async function load(){
 try{let data=await fetchJSON('/api/drives');const target=document.querySelector('#disks .content');target.replaceChildren();data.forEach(d=>{let wrap=document.createElement('div');wrap.className='disk';let label=document.createElement('div');label.textContent=d.unidade+'  —  '+d.livre_gb+' GB livres / '+d.total_gb+' GB';let track=document.createElement('div');track.className='track';let fill=document.createElement('div');fill.className='fill';fill.style.width=Math.min(100,100*d.usado_gb/d.total_gb)+'%';track.append(fill);wrap.append(label,track);target.append(wrap)})}catch(e){put('disks','Erro: '+e.message)}
 for(const [id,url,format] of [['home','/api/home',d=>d.map(x=>(x.tipo==='pasta'?'📁 ':'📄 ')+x.nome).join('\n')],['ollama','/api/ollama',d=>d.saida||d.erro||'Nenhum modelo listado'],['about','/api/status',d=>'Versão: '+d.versao+'\nModo: '+d.modo+'\nRaízes autorizadas:\n'+d.raizes_autorizadas.join('\n')]]){try{put(id,format(await fetchJSON(url)))}catch(e){put(id,'Erro: '+e.message)}}
}
function save(){const state={};ids.forEach(id=>{let e=document.getElementById(id);state[id]={top:e.style.top,left:e.style.left,width:e.style.width,height:e.style.height}});localStorage.setItem(key,JSON.stringify(state))}
try{const state=JSON.parse(localStorage.getItem(key)||'{}');ids.forEach(id=>{let e=document.getElementById(id);Object.assign(e.style,state[id]||{})})}catch(e){}
let z=10;
ids.forEach(id=>{const panel=document.getElementById(id);const bar=panel.querySelector('.bar');bar.addEventListener('pointerdown',ev=>{if(ev.button!==0||matchMedia('(max-width:850px)').matches)return;ev.preventDefault();panel.style.zIndex=++z;const rect=panel.getBoundingClientRect(),parent=document.getElementById('workspace').getBoundingClientRect();const dx=ev.clientX-rect.left,dy=ev.clientY-rect.top;bar.setPointerCapture(ev.pointerId);function move(p){panel.style.left=Math.max(0,p.clientX-parent.left-dx)+'px';panel.style.top=Math.max(0,p.clientY-parent.top-dy)+'px'}bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',()=>{bar.removeEventListener('pointermove',move);save()},{once:true})});new ResizeObserver(save).observe(panel)});
document.getElementById('refresh').onclick=load;document.getElementById('reset').onclick=()=>{localStorage.removeItem(key);location.reload()};load();
</script></body></html>
