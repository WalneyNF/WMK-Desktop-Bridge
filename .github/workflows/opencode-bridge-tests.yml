name: WMK Coding OpenCode - validacao

on:
  push:
    branches: [main]
    paths:
      - 'opencode_bridge.py'
      - 'web/coder.html'
      - 'web_server.py'
      - 'tests/test_opencode_bridge.py'
      - '.github/workflows/opencode-bridge-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar sintaxe Python
        run: python -m py_compile opencode_bridge.py web_server.py tests/test_opencode_bridge.py
      - name: Testar inicialização simulada e permissões
        run: python -m unittest discover -s tests -p 'test_opencode_bridge.py' -v
